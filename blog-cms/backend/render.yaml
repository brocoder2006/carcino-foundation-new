services:
  - type: web
    name: carcino-blog-backend
    env: python
    rootDir: blog-cms/backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: carcino-blog-db
          property: connectionString

databases:
  - name: carcino-blog-db
    databaseName: carcino_blog
    user: carcino_user
